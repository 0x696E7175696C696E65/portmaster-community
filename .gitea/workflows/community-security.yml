name: Community security checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    # Register an isolated Windows runner with this label before enabling required checks.
    # No release credentials, privileged installation, or remote cache publishing is used.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.3'
          cache: false
      - uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610
        with:
          node-version: '24.20.0'
      - name: Install locked dependencies without lifecycle scripts
        shell: pwsh
        working-directory: desktop/angular
        run: npm.cmd ci --ignore-scripts
      - name: Run community gate
        shell: pwsh
        run: ./scripts/security-check.ps1 -BuildUI
      - name: Audit frontend dependencies (findings fail the check)
        shell: pwsh
        working-directory: desktop/angular
        run: npm.cmd audit --audit-level=high
